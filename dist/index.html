<head><title>MyMap Example</title><style rel=stylesheet>html{position:relative}body{background:#4262b0;width:100%;margin:0;padding:0;position:relative}.canvas{box-sizing:content-box;width:100%;height:100%;padding:50px 0}.tips{color:#fff;background:rgba(0,0,0,.5);border-radius:4px;padding:5px 10px;display:none;position:absolute;top:0;left:0}</style><script defer src=pointmap.min.js></script></head><body><div class=canvas id=map></div><div class=tips></div><script>let map=new PointMap("map");map.addEvents([{name:"上海",coordinate:[121.47,31.233]},{name:"北京",coordinate:[116.41,39.9]},{name:"香港",coordinate:[114.17,22.32]},{name:"普吉岛",coordinate:[98.34,7.95]},{name:"敦煌",coordinate:[94.66,40.14]},{name:"黄山",coordinate:[118.33,29.71]},{name:"马鞍山",coordinate:[118.5,31.67]},{name:"合肥",coordinate:[117.23,31.82]},{name:"淮南",coordinate:[116.99,32.62]},{name:"南京",coordinate:[118.79,32.06]},{name:"深圳",coordinate:[114.06,22.54]},{name:"广州",coordinate:[113.26,23.13]},{name:"佛山",coordinate:[113.12,23.02]},{name:"古格王朝",coordinate:[91.14,31.46]},{name:"拉萨",coordinate:[116.99,29.65]},{name:"西宁",coordinate:[101.78,36.62]},{name:"仙本那",coordinate:[118.61,4.48]},{name:"奥克兰",coordinate:[174.88,-40.9]},{name:"怀托莫",coordinate:[175.11,-38.26]},{name:"马塔马塔",coordinate:[175.78,-37.81]},{name:"基督城",coordinate:[172.64,-43.53]},{name:"福克斯冰川",coordinate:[170.01,-43.46]},{name:"瓦纳卡",coordinate:[169.13,-44.7]},{name:"皇后镇",coordinate:[168.66,-45.03]},{name:"达尼丁",coordinate:[170.5,-45.88]},{name:"蒂阿瑙",coordinate:[167.72,-45.41]},{name:"华盛顿",coordinate:[-77.04,38.91]},{name:"旧金山",coordinate:[-122.42,37.77]},{name:"曼谷",coordinate:[100.5,13.76]},{name:"洛杉矶",coordinate:[-118.24,34.05]}]);const tips=document.querySelector(".tips");map.on("mousemove",function(e,n){n?(tips.style.top=e.pageY+10,tips.style.left=e.pageX+10,tips.style.display="block",tips.innerText=n.map(e=>e.name).join("\n")):tips.style.display="none"});</script></body></html>
